<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live-Ergebnisse</title>
<style>
html,body{margin:0;height:100%;background:#0f1620;}
body{font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#e8edf3;}
#wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:20px;box-sizing:border-box;}
#wait a{color:#ff7a1a;}
#status{color:#8ea0b5;font-size:0.95rem;margin-top:10px;line-height:1.45;max-width:480px;}
h1{font-size:1.4rem;margin:14px 0 6px;}
#frame{position:fixed;top:0;left:0;width:100%;height:100%;border:0;display:none;background:#0f1620;}
#banner{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;display:none;
  background:#17212c;color:#e8edf3;border:1px solid #ff7a1a;border-radius:10px;padding:9px 14px;
  font-size:0.9rem;box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:90%;text-align:center;}
</style></head><body>
<div id="wait"><div><svg width="96" height="96" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="104" fill="#0f1620"/>
  <!-- Stoppuhr oben -->
  <rect x="232" y="44" width="48" height="24" rx="8" fill="#ff7a1a"/>
  <rect x="248" y="64" width="16" height="18" fill="#ff7a1a"/>
  <circle cx="256" cy="156" r="70" fill="none" stroke="#e8edf3" stroke-width="18"/>
  <path d="M256 86 A70 70 0 0 1 326 156" fill="none" stroke="#ff7a1a" stroke-width="18" stroke-linecap="round"/>
  <path d="M256 156 L256 112" stroke="#e8edf3" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="156" r="11" fill="#ff7a1a"/>
  <!-- Tempolinien -->
  <g stroke="#e8edf3" stroke-width="12" stroke-linecap="round" opacity=".45">
    <path d="M52 300 L100 300"/><path d="M40 340 L96 340"/><path d="M60 380 L104 380"/>
  </g>
  <!-- Läufer -->
  <g stroke="#e8edf3" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="176" cy="270" r="19" fill="#e8edf3" stroke="none"/>
    <path d="M166 300 L148 364"/>
    <path d="M162 314 L128 330 L112 306"/>
    <path d="M164 310 L198 334 L220 318"/>
    <path d="M148 364 L184 392 L172 440"/>
    <path d="M148 364 L116 398 L88 390"/>
  </g>
  <!-- Inline-Skater, klassische Laufhaltung -->
  <g stroke="#ff7a1a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="402" cy="290" r="19" fill="#ff7a1a" stroke="none"/>
    <path d="M380 304 L312 332"/>
    <path d="M372 308 L330 306"/>
    <path d="M378 312 L392 360"/>
    <path d="M312 332 L360 380 L334 418"/>
    <path d="M312 332 L270 370 L236 384"/>
    <path d="M310 434 L364 434"/>
  </g>
  <g fill="#ff7a1a"><circle cx="316" cy="450" r="8"/><circle cx="337" cy="450" r="8"/><circle cx="358" cy="450" r="8"/>
  <circle cx="226" cy="396" r="8"/></g>
</svg>
<h1>Live-Ergebnisse</h1>
<div id="status">Verbinde &hellip;</div>
<div style="margin-top:14px;"><a id="fallback-link" href="https://facts-des-switched-local.trycloudflare.com">Hier klicken</a>, falls das nicht automatisch funktioniert.</div>
</div></div>
<iframe id="frame" title="Live-Ergebnisse" allow="web-share; clipboard-write; fullscreen"></iframe>
<div id="banner">Verbindung unterbrochen &ndash; verbinde neu &hellip;</div>
<script>
var fallbackTarget = "https://facts-des-switched-local.trycloudflare.com";
var apiUrl = "https://api.github.com/repos/hansi478/speedrace-dashboard/contents/current-url.json";
var rawUrl = "https://raw.githubusercontent.com/hansi478/speedrace-dashboard/HEAD/current-url.json";
var SLUG_RE = /^\d{4}-\d{2}-\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*$/;
var slug = '';
try { slug = new URLSearchParams(window.location.search).get('v') || ''; } catch (e) {}
if (!SLUG_RE.test(slug)) slug = '';
var framePath = slug ? '/' + slug : '/';   // zuletzt im Rahmen angezeigte Seite
var attempt = 0, lastTarget = null, lastLookup = 0, current = null;
var helloSeen = false, failures = 0, watching = false;
var frame = document.getElementById('frame');
function setStatus(msg) { document.getElementById('status').textContent = msg; }
function base(u) { return String(u || '').replace(/\/+$/, ''); }
function originOf(u) { try { return new URL(u).origin; } catch (e) { return ''; } }
function dest(u) { return base(u) + (framePath === '/' ? '' : framePath); }
function fromApi() {
  return fetch(apiUrl, {cache: 'no-store'})
    .then(function(r) { return r.ok ? r.json() : Promise.reject('http ' + r.status); })
    .then(function(d) { return JSON.parse(atob(d.content.replace(/\n/g, ''))).url; });
}
function fromRaw() {
  return fetch(rawUrl + '?t=' + Date.now(), {cache: 'no-store'})
    .then(function(r) { return r.ok ? r.json() : Promise.reject('http ' + r.status); })
    .then(function(d) { return d.url; });
}
function lookup() {
  // Adresse neu nachschlagen: beim ersten Mal und danach höchstens alle
  // 30 Sekunden (schont das Abruf-Limit der GitHub-API).
  if (lastTarget && Date.now() - lastLookup < 30000) return Promise.resolve(lastTarget);
  lastLookup = Date.now();
  return fromApi().catch(fromRaw).then(function(u) {
    if (!/^https:\/\//.test(u || '')) throw 'ungueltig';
    lastTarget = u; return u;
  }).catch(function() { return lastTarget || fallbackTarget; });
}
function ping(target) {
  return fetch(base(target) + '/api/ping', {cache: 'no-store', mode: 'cors'})
    .then(function(r) { return r.ok; }).catch(function() { return false; });
}
function syncAddress() {
  // Adresszeile auf der GitHub-Adresse halten, aber die gerade angezeigte
  // Veranstaltung merken (Neu laden / Lesezeichen / Teilen führen dorthin).
  var m = framePath.match(/^\/(\d{4}-\d{2}-\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*)/);
  var q = m ? '?v=' + m[1] : '';
  try { history.replaceState(null, '', window.location.pathname + q); } catch (e) {}
}
function show(target) {
  current = target;
  helloSeen = false;
  frame.src = dest(target);
  frame.style.display = 'block';
  document.getElementById('wait').style.display = 'none';
  document.getElementById('banner').style.display = 'none';
  // Ältere Programmversionen erlauben das Einbetten nicht: meldet sich die
  // Seite im Rahmen nicht, wie bisher direkt weiterleiten.
  setTimeout(function() { if (!helloSeen && current === target) window.location.replace(dest(target)); }, 12000);
  if (!watching) { watching = true; setTimeout(watch, 20000); }
}
window.addEventListener('message', function(ev) {
  if (!current || ev.origin !== originOf(current) || !ev.data || ev.data.type !== 'sr-nav') return;
  helloSeen = true;
  if (typeof ev.data.path === 'string' && ev.data.path.charAt(0) === '/') framePath = ev.data.path;
  if (typeof ev.data.title === 'string' && ev.data.title) document.title = ev.data.title.slice(0, 200);
  syncAddress();
});
function watch() {
  // Läuft der Server noch unter derselben Adresse? Sonst (z.B. nach einem
  // Neustart mit neuem Cloudflare-Link) die neue Adresse holen und den
  // Rahmen - mit derselben Seite - neu laden.
  ping(current).then(function(ok) {
    if (ok) { failures = 0; document.getElementById('banner').style.display = 'none';
              setTimeout(watch, 20000); return; }
    failures++;
    if (failures < 2) { setTimeout(watch, 5000); return; }
    document.getElementById('banner').style.display = 'block';
    lookup().then(function(target) {
      return ping(target).then(function(ok2) {
        if (ok2) { failures = 0; if (base(target) !== base(current)) show(target);
                   else document.getElementById('banner').style.display = 'none'; }
        setTimeout(watch, ok2 ? 20000 : 10000);
      });
    });
  });
}
function retry() {
  var delay = attempt < 15 ? 2000 : (attempt < 45 ? 5000 : 15000);
  if (attempt < 15) { setStatus('Verbinde … (Versuch ' + attempt + ')'); }
  else { setStatus('Die Live-Ergebnisse sind gerade nicht erreichbar (z.B. kurze Unterbrechung der Verbindung). Diese Seite versucht es automatisch weiter und zeigt sie an, sobald sie wieder erreichbar sind.'); }
  setTimeout(cycle, delay);
}
function cycle() {
  attempt++;
  lookup().then(function(target) {
    document.getElementById('fallback-link').href = dest(target);
    return ping(target).then(function(ok) { if (ok) show(target); else retry(); });
  }).catch(function() { retry(); });
}
cycle();
</script></body></html>
